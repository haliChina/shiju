<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" overflow="hidden" role="img" aria-labelledby="t d"><title id="t">拾句数据逻辑</title><desc id="d">句子数据保存在 localStorage，可通过 JSON 导入导出并由可选功能产生外部请求。</desc><rect width="1200" height="420" rx="24" fill="#2D2822"/><g font-family="Arial,'PingFang SC','Microsoft YaHei',sans-serif"><text x="58" y="58" fill="#D9B77B" font-family="monospace" font-size="17">DATA FLOW / PRIVACY BOUNDARY</text><text x="58" y="103" fill="#FFFFFF" font-size="36" font-weight="700">本地句库是核心，外部服务是可选项</text><g transform="translate(58 151)"><rect width="270" height="154" rx="15" fill="#38312B" stroke="#6D5D4F"/><text x="23" y="34" fill="#D9B77B" font-family="monospace" font-size="15">BROWSER UI</text><text x="23" y="76" fill="#FFFFFF" font-size="23" font-weight="700">收藏 / 检索 / 回顾</text><text x="23" y="109" fill="#BDB2A7" font-size="17">所有核心操作</text><text x="23" y="134" fill="#BDB2A7" font-size="17">由 script.js 完成</text><path d="M277 77H330M320 68L330 77L320 86" fill="none" stroke="#D9B77B" stroke-width="2.5"/></g><g transform="translate(388 151)"><rect width="310" height="154" rx="15" fill="#F5EFE5"/><text x="23" y="34" fill="#8A5B1E" font-family="monospace" font-size="15">LOCAL STORAGE</text><text x="23" y="76" fill="#2D2822" font-size="23" font-weight="700">shiju_data</text><text x="23" y="109" fill="#6F665D" font-size="17">句子 · 标签 · 文集 · 笔记</text><text x="23" y="134" fill="#6F665D" font-size="17">+ 7 天本地自动备份</text></g><g transform="translate(758 151)"><rect width="384" height="154" rx="15" fill="#38312B" stroke="#6D5D4F"/><text x="23" y="34" fill="#D9B77B" font-family="monospace" font-size="15">OPTIONAL NETWORK</text><text x="23" y="73" fill="#FFFFFF" font-size="21" font-weight="700">一言 API · Google Fonts</text><text x="23" y="103" fill="#FFFFFF" font-size="21" font-weight="700">jsPDF / html2canvas CDN</text><text x="23" y="134" fill="#BDB2A7" font-size="16">只在相应页面或功能中使用</text></g><path d="M698 228H748M738 219L748 228L738 237" fill="none" stroke="#D9B77B" stroke-width="2.5"/><g transform="translate(58 339)" font-family="monospace" font-size="15"><circle cx="7" cy="-5" r="6" fill="#D9B77B"/><text x="25" fill="#BDB2A7">Clearing site data removes the local library. Export JSON backups regularly.</text></g></g></svg>