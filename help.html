<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使用指南 - 拾句</title><meta name="description" content="拾句使用指南：3步上手收藏、分类和复习句子素材。"><meta name="robots" content="index,follow"><link rel="canonical" href="https://shiju.app/help.html"><meta name="twitter:card" content="summary_large_image"><link rel="stylesheet" href="style.css"></head><body><main class="main"><h1>使用指南</h1><p>如果你第一次使用拾句，建议按“先收集、再分类、最后回顾”的顺序建立个人语料库，这样最容易长期坚持并形成可复用资产。</p><h2>三步上手</h2><ol><li>添加句子并补全作者、来源。</li><li>给句子打标签并放入文集。</li><li>每天使用随机回顾与搜索复盘。</li></ol></main></body></html>
