  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Serif SC', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji';
      --c-bg: #f7f4ef;
      --c-bg-2: #f0ebe4;
      --c-surface: #fff;

      --c-success: #3d8a5b;

      --c-hover: #f7f4ef;
    }
    body {
      background: var(--c-bg);
      color: var(--c-text-1);
      display: flex;
      align-items: center;
      justify-content: center;

    }
    .container {

      border: 1px solid var(--c-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(60,40,10,.06);
      max-height: 90vh;
      overflow-y: auto;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
      position: sticky;
      top: -32px;
      padding-top: 8px;
      padding-bottom: 16px;
      background: var(--c-surface);
      z-index: 1;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
      color: var(--c-text-1);
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--c-text-3);
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      background: transparent;
    }
    .back-btn:hover {
      background: var(--c-hover);
      color: var(--c-text-2);
      transform: translateY(-1px);
    }
    .legal-section {
      margin-bottom: 28px;
    }
    .legal-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--c-text-1);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--c-border);
    }
    .legal-content {
      font-size: 13px;
      line-height: 1.8;
      color: var(--c-text-2);
    }
    .legal-content p {
      margin: 0 0 12px 0;
    }
    .legal-content ul {
      margin: 8px 0 12px 20px;
      padding: 0;
    }
    .legal-content li {
      margin-bottom: 6px;
    }
    .footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--c-border);
      text-align: center;
      font-size: 12px;
      color: var(--c-text-3);
    }
    .footer a {
      color: var(--c-accent);
      text-decoration: none;
    }
    @media (max-width: 640px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }
      .container {
        padding: 24px 20px;
        border-radius: 20px;
        max-height: 85vh;
      }
      .header {
        position: sticky;
        top: -24px;
      }
    }
  </style>
</head>

</html>
