<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta property="og:title" content="关于拾句 - 产品定位与使用场景" />

  <meta property="og:type" content="article" />
  <meta property="og:url" content="https://shiju.app/links.html" />

  <title>关于拾句 - 拾句</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: 'Inter', 'Noto Serif SC', system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, 'Noto Sans', 'Apple Color Emoji', 'Segoe UI Emoji';
      --c-bg: #f7f4ef;
      --c-bg-2: #f0ebe4;
      --c-surface: #fff;
      --c-surface-1: #fbf9f6;
      --c-text-1: #1e1a14;
      --c-text-2: #5c5040;
      --c-text-3: #9b8c78;
      --c-border: #e8e1d6;
      --c-border-2: #f2ece3;
      --c-accent: #a3722a;
      --c-accent-2: #c4924a;
      --c-accent-dim: #926424;
      --c-accent-bg: #f8eed9;
      --c-accent-bg-2: #f3e0b7;
      --c-danger: #cc5555;
      --c-danger-bg: #ffe7e7;
      --c-success: #3d8a5b;
      --c-success-bg: #e6f3ec;
      --c-hover: #f7f4ef;
    }
    body {
      background: var(--c-bg);
      color: var(--c-text-1);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 8px 32px rgba(60,40,10,.06);
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 600;
      margin: 0;
      color: var(--c-text-1);
    }
    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--c-text-3);
      cursor: pointer;
      transition: all 0.15s ease;
      border: none;
      background: transparent;
    }
    .back-btn:hover {
      background: var(--c-hover);
      color: var(--c-text-2);
      transform: translateY(-1px);
    }
    .group-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--c-text-3);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-left: 4px;
    }
    .links-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 24px;
    }
    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
      color: var(--c-text-1);
    }
    .link-item:hover {
      background: var(--c-hover);
    }
    .link-item:active {
      transform: scale(0.98);
    }
    .link-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .link-icon {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--c-surface-1);
      border: 1px solid var(--c-border-2);
      border-radius: 10px;
      color: var(--c-text-3);
    }
    .link-icon svg {
      width: 18px;
      height: 18px;
    }
    .link-main {
      display: flex;
      flex-direction: column;
    }
    .link-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--c-text-1);
    }
    .link-desc {
      font-size: 12px;
      color: var(--c-text-3);
    }
    .link-arrow {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--c-text-3);
    }
    .link-arrow svg {
      width: 18px;
      height: 18px;
    }
    .divider {
      height: 1px;
      background: var(--c-border);
      margin: 20px 0;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: var(--c-accent-bg);
      color: var(--c-accent);
    }
    .status-dot {
      width: 7px;
      height: 7px;
      background: var(--c-accent);
      border-radius: 50%;
    }
    .footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--c-border);
      text-align: center;
      font-size: 12px;
      color: var(--c-text-3);
    }
    .footer a {
      color: var(--c-accent);
      text-decoration: none;
    }
    @media (max-width: 640px) {
      body {
        padding: 12px;
        align-items: flex-start;
      }
      .container {
        padding: 24px 20px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>关于拾句</h1>
      <button class="back-btn" onclick="location.href='index.html'" title="返回">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 6L6 18M6 6l12 12" transform="rotate(90 12 12)"/>

              <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>

            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </a>
      <a href="privacy-policy.html" class="link-item">
        <div class="link-left">

              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>

          </div>
          <div class="link-main">
            <div class="link-title">隐私政策</div>

          </div>
        </div>
        <div class="link-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </a>
      <a href="copyright-notice.html" class="link-item">
        <div class="link-left">
          <div class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
          </div>
          <div class="link-main">
            <div class="link-title">版权声明</div>
            <div class="link-desc">版权与托管说明</div>
          </div>
        </div>
        <div class="link-arrow">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </div>
      </a>
    </div>

    <div class="divider"></div>

    <div class="group-title">网站状态</div>
    <div class="links-list">
      <a href="https://status.userhali.com" target="_blank" class="link-item">
        <div class="link-left">
          <div class="link-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
            </svg>
          </div>
          <div class="link-main">
            <div class="link-title">网站状态</div>
            <div class="link-desc">查看服务运行状况</div>

        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          <span class="status-badge">

            在线

          <div class="link-arrow">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"/>
            </svg>
          </div>
        </div>
      </a>
    </div>

    <div class="footer">
      <a href="index.html">返回拾句主页</a>
    </div>
  </div>
</body>
